<script>try{var t=localStorage.getItem('aneto-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>

<style>
  .qr-page{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px calc(32px + env(safe-area-inset-bottom))}
  .qr-card{width:100%;max-width:420px;text-align:center}
  .qr-card .brand-logo{font-size:3.4rem;margin:0 auto 4px}
  .qr-card .brand-logo b{position:relative;display:block;font-family:var(--font-display);font-weight:700;letter-spacing:.06em;color:var(--fg);line-height:.95}
  .qr-lead{text-wrap:balance}
  .qr-sub{color:var(--accent);font-weight:700;margin:0 0 6px}
  .qr-lead{color:var(--muted);margin:0 0 28px}
  .qr-links{display:grid;gap:12px;margin:0;padding:0;list-style:none}
  .qr-links a{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:var(--bg);color:var(--fg);text-decoration:none;font-weight:700;font-size:1.08rem;text-align:left;transition:transform .15s ease,border-color .15s ease}
  .qr-links a:hover,.qr-links a:focus-visible{transform:translateY(-2px);border-color:var(--accent)}
  .qr-links .ic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff}
  .qr-links .ic svg{width:22px;height:22px}
  .qr-links small{display:block;font-weight:400;color:var(--muted);font-size:.9rem}
  .ic-fb{background:#17525C}.ic-ig{background:#E58AA3}.ic-rv{background:#E9A91C}.ic-web{background:#3AA3B5}.ic-tel{background:#2E9E57}
  .qr-foot{margin-top:28px;color:var(--muted);font-size:.9rem}
</style>
</head>
